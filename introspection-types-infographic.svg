<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1800" viewBox="0 0 1400 1800" role="img" aria-labelledby="title desc">
  <title id="title">Types of Introspection in LangGraph</title>
  <desc id="desc">An infographic showing five types of introspection in LangGraph: State, Decision, Tool, Outcome, and Recovery with simple explanations.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>

    <style>
      .h1 { font: 700 58px 'Georgia', 'Times New Roman', serif; fill: #f8fafc; }
      .sub { font: 400 28px 'Verdana', 'Trebuchet MS', sans-serif; fill: #cbd5e1; }
      .cardTitle { font: 700 38px 'Verdana', 'Trebuchet MS', sans-serif; fill: #f8fafc; }
      .cardBody { font: 400 24px 'Verdana', 'Trebuchet MS', sans-serif; fill: #dbeafe; }
      .chip { font: 700 20px 'Verdana', 'Trebuchet MS', sans-serif; fill: #e2e8f0; }
      .footer { font: 600 24px 'Verdana', 'Trebuchet MS', sans-serif; fill: #e2e8f0; }
    </style>
  </defs>

  <rect width="1400" height="1800" fill="url(#bg)"/>

  <circle cx="180" cy="180" r="130" fill="#38bdf8" fill-opacity="0.14"/>
  <circle cx="1250" cy="1640" r="170" fill="#22d3ee" fill-opacity="0.10"/>

  <text x="110" y="130" class="h1">Types of Introspection in LangGraph</text>
  <text x="110" y="180" class="sub">A beginner-friendly map for AI Engineering reliability</text>

  <rect x="110" y="220" rx="16" ry="16" width="560" height="52" fill="#0ea5e9" fill-opacity="0.24" stroke="#7dd3fc" stroke-opacity="0.7"/>
  <text x="135" y="254" class="chip">Big Word Alert: LangSmith tracing = flight recorder</text>

  <g>
    <rect x="110" y="320" rx="20" ry="20" width="1180" height="220" fill="url(#panel)" stroke="#7dd3fc"/>
    <text x="160" y="390" class="cardTitle">1) State Introspection</text>
    <text x="160" y="438" class="cardBody">Tracks state transitions after each node run.</text>
    <text x="160" y="478" class="cardBody">Use it to catch lost context, stale memory, or overwritten keys.</text>
  </g>

  <g>
    <rect x="110" y="575" rx="20" ry="20" width="1180" height="220" fill="url(#panel)" stroke="#86efac"/>
    <text x="160" y="645" class="cardTitle">2) Decision Introspection</text>
    <text x="160" y="693" class="cardBody">Explains why a router selected one graph branch.</text>
    <text x="160" y="733" class="cardBody">Use it to diagnose misrouting and wrong intent conditions.</text>
  </g>

  <g>
    <rect x="110" y="830" rx="20" ry="20" width="1180" height="220" fill="url(#panel)" stroke="#fcd34d"/>
    <text x="160" y="900" class="cardTitle">3) Tool Introspection</text>
    <text x="160" y="948" class="cardBody">Audits tool payload, retries, timeout profile, and errors.</text>
    <text x="160" y="988" class="cardBody">Use it to catch contract mismatch, like order_id vs id fields.</text>
  </g>

  <g>
    <rect x="110" y="1085" rx="20" ry="20" width="1180" height="220" fill="url(#panel)" stroke="#d8b4fe"/>
    <text x="160" y="1155" class="cardTitle">4) Outcome Introspection</text>
    <text x="160" y="1203" class="cardBody">Measures output quality using relevance, grounding, and completion.</text>
    <text x="160" y="1243" class="cardBody">Use it to ensure fluent answers are also task-correct answers.</text>
  </g>

  <g>
    <rect x="110" y="1340" rx="20" ry="20" width="1180" height="220" fill="url(#panel)" stroke="#fca5a5"/>
    <text x="160" y="1410" class="cardTitle">5) Recovery Introspection</text>
    <text x="160" y="1458" class="cardBody">Tracks detection speed, rollback safety, and incident recovery time.</text>
    <text x="160" y="1498" class="cardBody">Use it to improve MTTR and production reliability confidence.</text>
  </g>

  <text x="110" y="1680" class="footer">Practical rule: Inspect behavior first, then optimize prompts.</text>
</svg>
